  <g transform="translate(68 52)"><g transform="scale(.78)"><g fill="#172554"><path d="M8 54.5V36.2C8 28.9 13.2 23 20.5 21.5v22.2c0 6.2-4.4 11.4-10.5 12.5A1.7 1.7 0 0 1 8 54.5Z"/><path d="M26 56.8V23.2C26 15.1 31.7 8.5 40 6.8v36.7c0 7.1-5 13.1-12.1 14.7A1.6 1.6 0 0 1 26 56.8Z"/><path d="M45 58V34.1c0-7.5 5.3-13.6 13-15.2v27c0 6.3-4.5 11.6-10.7 13A1.9 1.9 0 0 1 45 58Z"/></g><circle cx="51.5" cy="9.5" r="5.5" fill="#FF5B4D"/></g><text x="64" y="38" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="800" fill="#17191C">晨笙做东西</text></g>
  <text x="1010" y="86" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#315CFF">工具与工作流</text>
  <line x1="68" y1="142" x2="1012" y2="142" stroke="#CBD0D6" stroke-width="2"/>

  <text x="70" y="270" font-family="Microsoft YaHei, sans-serif" font-size="76" font-weight="900" fill="#17191C">别先改旧帖</text>
  <text x="70" y="376" font-family="Microsoft YaHei, sans-serif" font-size="104" font-weight="900" fill="#315CFF">跑一轮新样本</text>
  <text x="72" y="444" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#666B73">30 天，用新内容验证品牌系统</text>

  <g transform="translate(70 515)" font-family="Microsoft YaHei, sans-serif">
    <line x1="80" y1="60" x2="80" y2="700" stroke="#CBD0D6" stroke-width="14" stroke-linecap="round"/>
    <g><circle cx="80" cy="70" r="54" fill="#172554"/><text x="80" y="82" text-anchor="middle" font-family="Arial" font-size="30" font-weight="900" fill="#F7F3EA">W1</text><text x="170" y="55" font-size="38" font-weight="900" fill="#17191C">写清关注理由</text><text x="170" y="103" font-size="28" fill="#666B73">一句承诺；内容收进最多 3 个栏目</text></g>
    <g transform="translate(0 175)"><circle cx="80" cy="70" r="54" fill="#315CFF"/><text x="80" y="82" text-anchor="middle" font-family="Arial" font-size="30" font-weight="900" fill="#F7F3EA">W2</text><text x="170" y="55" font-size="38" font-weight="900" fill="#17191C">搭好主页入口</text><text x="170" y="103" font-size="28" fill="#666B73">3 篇置顶；准备 3 个封面方向</text></g>
    <g transform="translate(0 350)"><circle cx="80" cy="70" r="54" fill="#FF5B4D"/><text x="80" y="82" text-anchor="middle" font-family="Arial" font-size="30" font-weight="900" fill="#F7F3EA">W3</text><text x="170" y="55" font-size="38" font-weight="900" fill="#17191C">连续发新内容</text><text x="170" y="103" font-size="28" fill="#666B73">累计 6—9 篇；每篇做 5 人 / 5 秒测试</text></g>
    <g transform="translate(0 525)"><circle cx="80" cy="70" r="54" fill="#7A5CFA"/><text x="80" y="82" text-anchor="middle" font-family="Arial" font-size="30" font-weight="900" fill="#F7F3EA">W4</text><text x="170" y="55" font-size="38" font-weight="900" fill="#17191C">复盘，留下规律</text><text x="170" y="103" font-size="28" fill="#666B73">删掉无效动作，不凭一篇爆款转型</text></g>
  </g>

  <rect x="70" y="1240" width="940" height="112" rx="30" fill="#172554"/>
  <text x="104" y="1287" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#8EA7FF">按 24H / 7D / 30D 记录</text>
