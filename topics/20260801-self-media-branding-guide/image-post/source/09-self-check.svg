    <g transform="translate(0 225)"><rect width="940" height="190" rx="36" fill="#F7F3EA"/><text x="40" y="67" font-family="Arial" font-size="26" font-weight="900" fill="#315CFF">02 / PROMISE</text><text x="40" y="137" font-size="54" font-weight="900" fill="#17191C">为什么关注我？</text><circle cx="830" cy="95" r="50" fill="#FFF0ED"/><path d="M790 96l25 25 52-60" fill="none" stroke="#FF5B4D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>
