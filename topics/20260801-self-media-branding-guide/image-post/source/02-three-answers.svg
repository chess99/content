  <text x="70" y="1375" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#666B73">品牌化先回答问题，再决定颜色和模板。</text>
  <text x="1010" y="1375" text-anchor="end" font-family="Arial, sans-serif" font-size="24" fill="#8B9097">02 / 09</text>
