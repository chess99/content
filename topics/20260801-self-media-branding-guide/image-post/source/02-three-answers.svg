  <text x="1010" y="86" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#315CFF">工具与工作流</text>
  <line x1="68" y1="142" x2="1012" y2="142" stroke="#CBD0D6" stroke-width="2"/>

  <text x="70" y="280" font-family="Microsoft YaHei, sans-serif" font-size="92" font-weight="900" fill="#17191C">你缺的不是</text>
  <text x="70" y="390" font-family="Microsoft YaHei, sans-serif" font-size="112" font-weight="900" fill="#17191C">统一模板</text>
  <text x="72" y="488" font-family="Microsoft YaHei, sans-serif" font-size="54" font-weight="800" fill="#315CFF">而是 3 个稳定答案</text>

  <circle cx="540" cy="850" r="154" fill="#315CFF"/>
  <text x="540" y="830" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#F7F3EA">真正要统一的</text>
  <text x="540" y="900" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="64" font-weight="900" fill="#F7F3EA">关注理由</text>

  <g transform="translate(74 590) rotate(-4 170 130)">
    <rect width="335" height="250" rx="34" fill="#FFFFFF" stroke="#17191C" stroke-width="4"/>
    <text x="28" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#FF5B4D">01</text>
    <text x="28" y="130" font-family="Microsoft YaHei, sans-serif" font-size="54" font-weight="900" fill="#17191C">谁做的？</text>
    <text x="28" y="188" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#666B73">名字、脸、角色、声音</text>
  </g>
  <g transform="translate(672 596) rotate(4 166 130)">
    <rect width="334" height="250" rx="34" fill="#FFFFFF" stroke="#17191C" stroke-width="4"/>
    <text x="28" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#FF5B4D">02</text>
    <text x="28" y="130" font-family="Microsoft YaHei, sans-serif" font-size="48" font-weight="900" fill="#17191C">为什么关注？</text>
    <text x="28" y="188" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#666B73">持续得到什么</text>
  </g>
  <g transform="translate(330 1040) rotate(-1 210 125)">
    <rect width="420" height="246" rx="34" fill="#172554"/>
    <text x="30" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#FF5B4D">03</text>
    <text x="30" y="128" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#F7F3EA">下一条还有什么？</text>
    <text x="30" y="188" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#D7DCE5">让期待可以重复</text>
