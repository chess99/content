<svg xmlns="http://www.w3.org/2000/svg" width="720" height="730" viewBox="0 0 720 730" role="img"><title>AIHOT：从材料到公开内容</title><desc>api 统一读取 · web 服务端渲染 · 计算留在 worker</desc><rect width="720" height="730" fill="white"/><g fill="#202c39" font-family="PingFang SC,Heiti SC,Arial,sans-serif"><text x="32" y="52" font-size="32" font-weight="700">AIHOT：从材料到公开内容</text><rect x="32" y="100" width="650" height="88" rx="6" fill="#f4f7fa" stroke="#c9d5df"/><text x="52" y="134" font-size="28" font-weight="700">采集与判重</text><text x="52" y="166" font-size="23" >RSS / 网页 / JSON / X / 公众号 / 推送</text><path d="M357 190v17m-5-5 5 5 5-5" fill="none" stroke="#0969da" stroke-width="2"/><rect x="32" y="212" width="650" height="88" rx="6" fill="#f4f7fa" stroke="#c9d5df"/><text x="52" y="246" font-size="28" font-weight="700">判断与结构化</text><text x="52" y="278" font-size="23" >宽召回预筛 → 两次评分 ∥ 分类、事实、证据</text><path d="M357 302v17m-5-5 5 5 5-5" fill="none" stroke="#0969da" stroke-width="2"/><rect x="32" y="324" width="650" height="88" rx="6" fill="#f4f7fa" stroke="#c9d5df"/><text x="52" y="358" font-size="28" font-weight="700">中文写作</text><text x="52" y="390" font-size="23" >标题、摘要、阅读价值 · 严格基于当前材料</text><path d="M357 414v17m-5-5 5 5 5-5" fill="none" stroke="#0969da" stroke-width="2"/><rect x="32" y="436" width="650" height="88" rx="6" fill="#f4f7fa" stroke="#c9d5df"/><text x="52" y="470" font-size="28" font-weight="700">Fact → Story</text><text x="52" y="502" font-size="23" >同一次发生归并 · 后续进展保留 · 计算热度</text><path d="M357 526v17m-5-5 5 5 5-5" fill="none" stroke="#0969da" stroke-width="2"/><rect x="32" y="548" width="650" height="88" rx="6" fill="#f4f7fa" stroke="#c9d5df"/><text x="52" y="582" font-size="28" font-weight="700">统一公开读取层</text><text x="52" y="614" font-size="23" >网页 / RSS / API / MCP · 日报、周报、月报</text><text x="32" y="705" font-size="21" >api 统一读取 · web 服务端渲染 · 计算留在 worker</text></g></svg>