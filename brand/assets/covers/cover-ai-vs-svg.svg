    </filter>
    <clipPath id="g1-ai"><rect x="100" y="620" width="500" height="667" rx="22"/></clipPath>
    <clipPath id="g1-svg"><rect x="640" y="620" width="500" height="667" rx="22"/></clipPath>
    <clipPath id="g2-ai"><rect x="1260" y="620" width="500" height="667" rx="22"/></clipPath>
